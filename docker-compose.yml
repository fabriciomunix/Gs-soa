# Opcional: PostgreSQL local. Por padrão a API usa SQLite.
services:
  postgres:
    image: postgres:16-alpine
    container_name: alerta-corrego-db
    environment:
      POSTGRES_USER: alerta
      POSTGRES_PASSWORD: alerta
      POSTGRES_DB: alerta_corrego
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alerta -d alerta_corrego"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
